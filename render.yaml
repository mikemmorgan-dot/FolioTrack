services:
  - type: web
    name: model-portfolio-tracker
    runtime: node
    plan: free
    buildCommand: npm run build && npm --prefix server install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      # Durable storage. Paste your Neon (or other Postgres) connection string here,
      # or set it in the Render dashboard. WITHOUT it the app falls back to an
      # ephemeral JSON file that is wiped on every restart — edits will not survive.
      - key: DATABASE_URL
        sync: false
      # Twelve Data free API key (twelvedata.com/pricing) — fallback price source
      # when Yahoo blocks Render's IP. Set in the Render dashboard, not here.
      # WITHOUT it the app still works but has no fallback: a Yahoo block means
      # lookups fail until this is set. Free tier does NOT cover TSX quotes.
      - key: TWELVEDATA_API_KEY
        sync: false
      # Finnhub free API key (finnhub.io) — second fallback, added specifically
      # for TSX coverage that Twelve Data's free tier doesn't include. Set in
      # the Render dashboard, not here.
      - key: FINNHUB_API_KEY
        sync: false
      # Alpha Vantage free API key (alphavantage.co) — last-resort fallback.
      # Free tier is 25 requests/DAY total, so it only matters for symbols the
      # other three providers all miss. Set in the Render dashboard, not here.
      - key: ALPHAVANTAGE_API_KEY
        sync: false
      # Resend (https://resend.com) — price-drop alerts. Render free tier blocks
      # outbound SMTP, so mail goes through the HTTPS API only. The default
      # onboarding@resend.dev sender can only deliver to the account owner's email.
      - key: RESEND_API_KEY
        sync: false
      # Optional. Defaults to: FolioTrack <onboarding@resend.dev>
      - key: ALERT_FROM
        sync: false
      # Secret for GET/POST /api/alerts/check?token=... (optional backup ping).
      # The free instance sleeps. .github/workflows/keepalive.yml pings /api/health
      # and does not use this token. Starter plan and above do not sleep.
      - key: ALERT_CRON_TOKEN
        sync: false
