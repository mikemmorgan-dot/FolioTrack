services:
  - type: web
    name: model-portfolio-tracker
    runtime: node
    plan: free
    buildCommand: npm run build && npm --prefix server install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      # Durable storage. Paste your Neon (or other Postgres) connection string here,
      # or set it in the Render dashboard. WITHOUT it the app falls back to an
      # ephemeral JSON file that is wiped on every restart — edits will not survive.
      - key: DATABASE_URL
        sync: false
      # Twelve Data free API key (twelvedata.com/pricing) — fallback price source
      # when Yahoo blocks Render's IP. Set in the Render dashboard, not here.
      # WITHOUT it the app still works but has no fallback: a Yahoo block means
      # lookups fail until this is set. Free tier does NOT cover TSX quotes.
      - key: TWELVEDATA_API_KEY
        sync: false
      # Finnhub free API key (finnhub.io) — second fallback, added specifically
      # for TSX coverage that Twelve Data's free tier doesn't include. Set in
      # the Render dashboard, not here.
      - key: FINNHUB_API_KEY
        sync: false
