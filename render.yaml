services:
  - type: web
    name: model-portfolio-tracker
    runtime: node
    plan: free
    buildCommand: npm run build && npm --prefix server install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      # Durable storage. Paste your Neon (or other Postgres) connection string here,
      # or set it in the Render dashboard. WITHOUT it the app falls back to an
      # ephemeral JSON file that is wiped on every restart — edits will not survive.
      - key: DATABASE_URL
        sync: false
