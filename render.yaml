services:
  - type: web
    name: model-portfolio-tracker
    runtime: node
    plan: free
    buildCommand: npm run build && npm --prefix server install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      # For durable storage, point this at a mounted disk or swap store.js for Postgres.
      # - key: DATA_FILE
      #   value: /var/data/store.json
    # Uncomment to persist the JSON store across restarts (requires a paid instance):
    # disk:
    #   name: mpt-data
    #   mountPath: /var/data
    #   sizeGB: 1
