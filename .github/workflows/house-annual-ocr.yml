# OCR image-only House annual financial disclosures (Form A and
# amendment letters). Also re-parses text-layer filings that were
# wrongly marked unreadable. Holdings are written to the holdings
# tables and are not emailed.
# The Render service is Node and has no tesseract, so this job is
# the only place House annual OCR runs.
#
# GitHub may start the cron a few minutes late, and it turns scheduled
# workflows off after 60 days without repository activity.
name: House annual OCR

on:
  schedule:
    - cron: '45 12 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Pending House filings to OCR this run. Blank uses 3.'
        required: false
        type: string
      revisit_cap:
        description: 'Unreadable House filings to re-parse this run. Blank uses 15.'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: house-annual-ocr
  cancel-in-progress: false

jobs:
  ocr:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install tesseract, poppler, and Python imaging
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr poppler-utils python3-pil

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Re-parse unreadable House annuals and OCR image-only filings
        working-directory: server
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          HOUSE_OCR_LIMIT: ${{ github.event.inputs.limit }}
          HOUSE_REVISIT_CAP: ${{ github.event.inputs.revisit_cap }}
          POLITICIAN_FETCH_DELAY_MS: '1200'
        run: node politicians/houseAnnualOcrCli.js
