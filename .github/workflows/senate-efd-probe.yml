# Manual reachability check. Logs HTTP status codes and a short body snippet.
# It does not print secrets. The push trigger used to start the first run
# has been removed.
name: Senate eFD probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Probe Senate eFD home, agreement, and one annual search
        working-directory: server
        run: node politicians/senateProbeCli.js

      - name: Read Pelosi annual queue position
        working-directory: server
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node politicians/pelosiAnnualCheck.js
