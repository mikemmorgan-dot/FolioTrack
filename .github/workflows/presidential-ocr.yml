# OCR scanned presidential and vice-presidential OGE filings.
# 278-T trades are written back for the next digest. 278e annual holdings
# are written to the holdings tables and are not emailed.
# The Render service is Node and has no tesseract.
# It also resolves asset names to tickers for new rows and for stored rows
# that still have no ticker, including House and Senate. A ticker printed on
# the filing is left alone, and a backfill does not send the digest again.
#
# GitHub may start the cron a few minutes late, and it turns scheduled
# workflows off after 60 days without repository activity.
name: Presidential OCR

on:
  schedule:
    - cron: '30 11 * * *'
  workflow_dispatch:
    inputs:
      filing_key:
        description: 'OGE document id to OCR again. Leave blank for the pending queue.'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: presidential-ocr
  cancel-in-progress: false

jobs:
  ocr:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install tesseract and poppler
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr poppler-utils

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: OCR pending 278-T filings and 278e annual reports
        working-directory: server
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OCR_FILING_KEY: ${{ github.event.inputs.filing_key }}
          POLITICIAN_FETCH_DELAY_MS: '1200'
        run: node politicians/presidentialOcrCli.js
